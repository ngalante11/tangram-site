<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Tangram Ad — Costs less than lunch (square)</title>
<link href="colors_and_type.css" rel="stylesheet">
<link href="ad-styles.css" rel="stylesheet">
<style>
  html,body{ background:#2D1659; }
  /* render the ad at true 1080 with no page chrome */
  body{ margin:0; display:block; }
</style>
</head>
<body>
<div class="ad st ad-bg-grape" style="background:linear-gradient(157deg,#401F7D 0%,#5a228f 42%,#88229D 74%,#B14FC5 116%);">
  <!-- decor -->
  <div class="ad-tex"></div>
  <div class="ad-blob" style="width:760px;height:760px;top:-240px;right:-200px;background:radial-gradient(circle, rgba(95,208,255,.22), transparent 68%);"></div>
  <div class="ad-blob" style="width:640px;height:640px;bottom:-220px;left:-180px;background:radial-gradient(circle, rgba(177,79,197,.30), transparent 70%);"></div>
  <div style="position:absolute;top:-2px;right:90px;width:0;height:0;z-index:2;border-left:150px solid transparent;border-right:150px solid transparent;border-top:170px solid rgba(255,255,255,.05);"></div>
  <div style="position:absolute;bottom:-40px;left:-30px;width:0;height:0;z-index:2;border-top:240px solid transparent;border-right:300px solid rgba(255,255,255,.045);"></div>

  <!-- content -->
  <div class="ad-in" style="padding:130px 96px;justify-content:space-between;">
    <span class="ad-eyebrow" style="font-size:28px;color:rgba(255,255,255,.92);">The real math</span>

    <div>
      <h2 class="ad-h" style="font-size:119px;color:#fff;">Costs less than<br><span style="color:#3FDE9D;">lunch.</span></h2>

      <div style="margin-top:44px;">
        <div style="display:flex;align-items:baseline;gap:26px;border-bottom:1.5px solid rgba(255,255,255,.16);padding:16px 0;">
          <span class="stat-num" style="font-family:'League Spartan',sans-serif;font-weight:800;font-size:75px;color:rgba(255,255,255,.55);min-width:240px;">$100+</span>
          <span style="font-family:'Alata',sans-serif;font-size:41px;color:rgba(255,255,255,.62);">a daily latte, per month</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:26px;border-bottom:1.5px solid rgba(255,255,255,.16);padding:16px 0;">
          <span class="stat-num" style="font-family:'League Spartan',sans-serif;font-weight:800;font-size:75px;color:rgba(255,255,255,.55);min-width:240px;">$200+</span>
          <span style="font-family:'Alata',sans-serif;font-size:41px;color:rgba(255,255,255,.62);">lunch out, per month</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:26px;border-bottom:1.5px solid rgba(255,255,255,.16);padding:16px 0;">
          <span class="stat-num" style="font-family:'League Spartan',sans-serif;font-weight:800;font-size:75px;color:rgba(255,255,255,.55);min-width:240px;">$15+</span>
          <span style="font-family:'Alata',sans-serif;font-size:41px;color:rgba(255,255,255,.62);">one streaming app</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:26px;padding:26px 0 0;">
          <span class="stat-num" style="font-family:'League Spartan',sans-serif;font-weight:800;font-size:96px;color:#3FDE9D;letter-spacing:-.03em;min-width:240px;">$4.99</span>
          <span style="font-family:'Alata',sans-serif;font-size:46px;color:#fff;">Tangram — a lesson for<br>every class, all month.</span>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:flex-end;justify-content:space-between;">
      <span class="ad-cta on-dark" style="font-size:38px;padding:32px 58px;">
        Start free
        <span class="arrow" style="width:60px;height:60px;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" style="display:block;"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </span>
      <div class="ad-foot">
        <img src="assets/Tangram_Secondary_Logo_Lilac.svg" alt="Tangram" style="height:52px;filter:brightness(0) invert(1);opacity:.9;">
        <span style="width:1px;height:31px;background:rgba(255,255,255,.25);"></span>
        <span class="ad-url" style="font-size:31px;color:rgba(255,255,255,.82);">gettangram.com</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
